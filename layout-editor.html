<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCAS — редактор схемы</title>
<style>
  :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#1c2b40;background:#f2f5f9}
  *{box-sizing:border-box}body{margin:0}.app{max-width:1240px;margin:auto;padding:20px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:22px;margin:0}p{margin:6px 0;color:#5b6a7c;font-size:14px}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button,.file-label{font:inherit;font-size:13px;border:1px solid #bdcbd9;background:white;color:#203149;border-radius:9px;padding:9px 12px;cursor:pointer}
  button:hover,.file-label:hover{background:#eaf1fa}.primary{background:#263e62;color:white;border-color:#263e62}.primary:hover{background:#344f78}
  input[type=file]{display:none}.layout{display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:16px;align-items:start}
  .stage,.panel{background:white;border:1px solid #d9e2ec;border-radius:14px;box-shadow:0 8px 25px #18314d0b}
  .stage{overflow:auto;padding:8px;max-height:calc(100vh - 125px)}
  #canvas{display:block;width:100%;min-width:700px;height:auto;background:white}
  .panel{padding:16px;position:sticky;top:12px}.panel h2{font-size:15px;margin:0 0 12px}
  label{display:block;font-size:12px;color:#52647c;margin:12px 0 5px}input[type=text],textarea,input[type=number]{width:100%;font:inherit;font-size:13px;border:1px solid #c7d4e3;border-radius:7px;padding:8px;color:#1c2b40}
  textarea{height:92px;resize:vertical}fieldset{border:0;padding:0;margin:0}fieldset:disabled{opacity:.5}
  .xy{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{line-height:1.45;font-size:12px;color:#66778d;margin-top:14px}
  #status{font-size:12px;color:#536d88;min-height:18px}
  @media(max-width:850px){.layout{grid-template-columns:1fr}.panel{position:static}.stage{max-height:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>PCAS — редактор схемы</h1><p>Перетаскивайте блоки. Линии следуют за ними; схема сохраняется в этом браузере.</p></div>
    <div class="tools">
      <button id="svgBtn" class="primary">Скачать SVG</button>
      <button id="pngBtn">Скачать PNG</button>
      <button id="jsonBtn">Сохранить расположение</button>
      <label class="file-label" for="jsonInput">Загрузить расположение</label><input id="jsonInput" type="file" accept="application/json,.json">
      <button id="resetBtn">Сбросить</button>
    </div>
  </header>
  <div class="layout">
    <div class="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1132" role="img" aria-label="Редактируемая схема PCAS">
        <defs>
          <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker>
          <marker id="auditArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0c887b"/></marker>
          <marker id="signalArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b76821"/></marker>
          <marker id="updateArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7655a6"/></marker>
          <marker id="ruleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bc4257"/></marker>
        </defs>
        <style>
          .page-title{font:700 23px "Segoe UI",Arial,sans-serif;fill:#17283e;text-anchor:middle}
          .page-sub{font:13px "Segoe UI",Arial,sans-serif;fill:#60738a;text-anchor:middle}
          .zone-title{font:700 15px "Segoe UI",Arial,sans-serif;fill:#8a4f1a}
          .node{touch-action:none;cursor:grab}.node:active{cursor:grabbing}.node.selected rect{stroke:#243f68;stroke-width:2.7}
          .node rect{stroke-width:1.4}.node text{text-anchor:middle;pointer-events:none;fill:#203149}
          .node .node-title{font:700 15px "Segoe UI",Arial,sans-serif}.node .node-detail{font:12px "Segoe UI",Arial,sans-serif;fill:#53657b}
          .edge{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
          .flow{stroke:#334155;marker-end:url(#flowArrow)}.audit{stroke:#0c887b}.audit-end{marker-end:url(#auditArrow)}
          .signal{stroke:#b76821;stroke-dasharray:6 5}.signal-end{marker-end:url(#signalArrow)}
          .update{stroke:#7655a6}.update-end{marker-end:url(#updateArrow)}.rule{stroke:#bc4257;marker-end:url(#ruleArrow)}
          .legend{font:12px "Segoe UI",Arial,sans-serif;fill:#52647c}
        </style>
        <rect width="800" height="1132" fill="#fff"/>
        <text class="page-title" x="400" y="34">PCAS — Hybrid Anti-Fraud Pipeline</text>
        <text class="page-sub" x="400" y="57">Detection — Verification — Adaptation</text>
        <rect id="level3-zone" x="70" y="365" width="665" height="450" rx="18" fill="#fff8ee" stroke="#e6c895" stroke-width="1.5"/>
        <text class="zone-title" x="94" y="391">LEVEL 3 — HUMAN–MACHINE TEAMING</text>
        <text x="94" y="408" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#936633">AI assistants</text>
        <g id="edges"></g><g id="nodes"></g>
        <g class="legend"><line x1="44" y1="1100" x2="68" y2="1100" stroke="#334155" stroke-width="2"/><text x="76" y="1104">flow</text><line x1="143" y1="1100" x2="167" y2="1100" stroke="#0c887b" stroke-width="2"/><text x="175" y="1104">audit</text><line x1="252" y1="1100" x2="276" y2="1100" stroke="#b76821" stroke-width="2" stroke-dasharray="6 5"/><text x="284" y="1104">to adaptation</text><line x1="444" y1="1100" x2="468" y2="1100" stroke="#7655a6" stroke-width="2"/><text x="476" y="1104">from adaptation</text><line x1="655" y1="1100" x2="679" y2="1100" stroke="#bc4257" stroke-width="2"/><text x="687" y="1104">4 → Level 1</text></g>
      </svg>
    </div>
    <aside class="panel"><h2 id="selectionTitle">Выберите блок</h2><fieldset id="fields" disabled>
      <label for="titleInput">Название (перенос строки — Enter)</label><textarea id="titleInput"></textarea>
      <label for="detailInput">Пояснение (перенос строки — Enter)</label><textarea id="detailInput"></textarea>
      <div class="xy"><div><label for="xInput">X</label><input id="xInput" type="number" min="0" max="800"></div><div><label for="yInput">Y</label><input id="yInput" type="number" min="0" max="1132"></div></div>
    </fieldset><p class="hint">Можно двигать блок мышью или пальцем. Выбранный блок также сдвигается клавишами ← ↑ → ↓; Shift — шаг 10. Экспорт SVG подходит для вставки в книжный А4.</p><div id="status" role="status" aria-live="polite"></div></aside>
  </div>
</div>
<script>
(() => {
  'use strict';
  const NS='http://www.w3.org/2000/svg', KEY='pcas-layout-editor-v1';
  const defaults={
    input:{x:70,y:100,w:140,h:70,title:'Input Stream',detail:'Domain D',kind:'plain'},
    l1:{x:250,y:100,w:150,h:80,title:'LEVEL 1\nRules Engine',detail:'hard stops + soft rules',kind:'rules'},
    l2:{x:440,y:85,w:305,h:105,title:'LEVEL 2 — Anomaly Predictor',detail:'f₁ Fraud score F  ·  f₂ Anomaly A\nf₃ Text signal T',kind:'predict'},
    low:{x:70,y:225,w:150,h:60,title:'Low risk',detail:'auto-approve',kind:'green'},
    auto:{x:385,y:225,w:160,h:60,title:'Auto-decline (F)',detail:'',kind:'green'},
    rank:{x:585,y:225,w:160,h:60,title:'Ranking by A',detail:'→ investigator queue',kind:'blue'},
    a1:{x:85,y:430,w:200,h:95,title:'1. Investigator\nAssistant',detail:'case narrative from f₃ · Q&A',kind:'plain'},
    a2:{x:305,y:430,w:190,h:95,title:'2. Customer\nVerification',detail:'verification dialogues · escalation',kind:'plain'},
    a3:{x:515,y:430,w:205,h:95,title:'3. Ecosystem\nCoordination',detail:'gateway to Level 4 · logged exchanges',kind:'plain'},
    a4:{x:85,y:590,w:200,h:95,title:'4. Rule Assistant',detail:'candidate rules · impact estimates',kind:'plain'},
    a5:{x:305,y:590,w:190,h:95,title:'5. Trainer–Emulator',detail:'synthetic cases · competency scoring',kind:'plain'},
    a7:{x:515,y:590,w:205,h:95,title:'7. Knowledge Curator',detail:'playbooks · attack-type mapping',kind:'plain'},
    qa:{x:515,y:735,w:205,h:70,title:'6. Quality & Audit',detail:'provenance log · fairness monitoring',kind:'plain'},
    l4:{x:515,y:845,w:205,h:80,title:'LEVEL 4\nEXTERNAL CONTOUR',detail:'state monitoring · telecom verification\ninter-bank blocking',kind:'green'},
    adapt:{x:245,y:990,w:310,h:83,title:'ADAPTATION LOOP',detail:'verified outcomes → feature store\nonline learning (f₁) · bound update (f₂)\nAI-proposed rules',kind:'adapt'}
  };
  const colors={plain:['#fff','#cbd8e6'],rules:['#fff5df','#dfb96d'],predict:['#f4f0ff','#b6a7df'],green:['#eaf8ee','#8bcba6'],blue:['#eaf2ff','#9cbdea'],adapt:['#fff6e8','#dba96b']};
  const clone=()=>JSON.parse(JSON.stringify(defaults));
  let data=clone(),selected=null,drag=null;
  try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object')for(const id of Object.keys(defaults))if(saved[id])data[id]={...defaults[id],...saved[id]}}catch{}
  const svg=document.getElementById('canvas'),edgeLayer=document.getElementById('edges'),nodeLayer=document.getElementById('nodes');
  const fields=document.getElementById('fields'),titleInput=document.getElementById('titleInput'),detailInput=document.getElementById('detailInput'),xInput=document.getElementById('xInput'),yInput=document.getElementById('yInput'),status=document.getElementById('status');
  const make=(tag,attrs={},parent)=>{const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));if(parent)parent.appendChild(el);return el};
  const cx=n=>n.x+n.w/2,cy=n=>n.y+n.h/2;
  const path=(d,cls)=>make('path',{d,class:'edge '+cls},edgeLayer);
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}};
  const setStatus=s=>{status.textContent=s;setTimeout(()=>{if(status.textContent===s)status.textContent=''},3500)};
  function printText(g,n){
    const lines=n.title.split('\n'),dlines=(n.detail||'').split('\n').filter(Boolean),hTitle=lines.length*18,hDetail=dlines.length*14;
    const total=hTitle+(hDetail?6+hDetail:0),first=n.h/2-total/2+15;
    const t=make('text',{class:'node-title',x:n.w/2,y:first},g);
    lines.forEach((line,i)=>{const sp=make('tspan',{x:n.w/2,dy:i?18:0},t);sp.textContent=line});
    if(dlines.length){const d=make('text',{class:'node-detail',x:n.w/2,y:first+hTitle+5},g);dlines.forEach((line,i)=>{const sp=make('tspan',{x:n.w/2,dy:i?14:0},d);sp.textContent=line})}
  }
  function renderNodes(){nodeLayer.replaceChildren();for(const [id,n] of Object.entries(data)){
    const g=make('g',{class:'node'+(id===selected?' selected':''),transform:`translate(${n.x} ${n.y})`,'data-id':id,tabindex:'0',role:'button','aria-label':n.title.replace(/\n/g,' ')},nodeLayer);
    const [fill,stroke]=colors[n.kind]||colors.plain;make('rect',{x:0,y:0,width:n.w,height:n.h,rx:12,fill,stroke},g);printText(g,n);
    g.addEventListener('pointerdown',startDrag);g.addEventListener('click',()=>select(id));g.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();select(id);const k=e.shiftKey?10:1;n.x+=({ArrowLeft:-k,ArrowRight:k}[e.key]||0);n.y+=({ArrowUp:-k,ArrowDown:k}[e.key]||0);clamp(n);g.setAttribute('transform',`translate(${n.x} ${n.y})`);renderEdges();syncFields();save()})
  }}
  function lineHorizontal(a,b){const sy=cy(a),ty=cy(b),mx=(a.x+a.w+b.x)/2;return `M${a.x+a.w} ${sy} H${mx} V${ty} H${b.x}`}
  function mainEdges(){for(const [s,t] of [['input','l1'],['l1','l2'],['a1','a2'],['a2','a3']])path(lineHorizontal(data[s],data[t]),'flow');
    const l=data.l1,lo=data.low,p=data.l2,au=data.auto,r=data.rank,a=data.a1,c=data.a3,l4=data.l4;
    path(`M${cx(l)} ${l.y+l.h} V${lo.y-20} H${cx(lo)} V${lo.y}`,'flow');
    for(const [target,port] of [[au,.2],[r,.72]]){const x=p.x+p.w*port;path(`M${x} ${p.y+p.h} V${target.y-17} H${cx(target)} V${target.y}`,'flow')}
    path(`M${cx(r)} ${r.y+r.h} V${Math.min(a.y-40,r.y+r.h+50)} H${cx(a)} V${a.y}`,'flow');
    const side=Math.max(c.x+c.w,l4.x+l4.w)+24;path(`M${c.x+c.w} ${cy(c)} H${side} V${l4.y-20} H${cx(l4)} V${l4.y}`,'flow')
  }
  function auditEdges(){const rail=775,q=data.qa,l=data.l1,p=data.l2,l4=data.l4;
    const top=Math.min(l.y-22,p.y-7,70),bottom=Math.max(l4.y+l4.h/2,cy(q));
    path(`M${rail} ${top} V${bottom}`,'audit');
    path(`M${cx(l)} ${l.y} V${top} H${rail}`,'audit');
    path(`M${cx(p)} ${p.y} V${top+14} H${rail}`,'audit');
    path(`M735 390 H${rail}`,'audit');
    path(`M${l4.x+l4.w} ${cy(l4)} H${rail}`,'audit');
    path(`M${rail} ${cy(q)} H${q.x+q.w}`,'audit audit-end')
  }
  function signalEdges(){const rail=18,a=data.adapt;let ys=[];
    for(const id of ['low','auto','rank','a2']){const n=data[id],low=id==='low',y=low?cy(n):n.y+n.h+({auto:22,rank:37,a2:25}[id]);ys.push(y);if(low)path(`M${n.x} ${cy(n)} H${rail}`,'signal');else path(`M${cx(n)} ${n.y+n.h} V${y} H${rail}`,'signal')}
    const top=Math.min(...ys),bottom=a.y-38;path(`M${rail} ${top} V${bottom} Q${rail} ${bottom+12} ${rail+12} ${bottom+12} H${a.x} V${a.y}`,'signal signal-end')
  }
  function updateEdges(){const a=data.adapt,p=data.l2,l=data.l1,r=data.a4,rail=40;
    path(`M${a.x} ${cy(a)} H${rail} V${cy(p)} H${p.x}`,'update update-end');
    const group=['a4','a5','a7'].map(id=>data[id]),bus=Math.max(...group.map(n=>n.y+n.h))+30;
    path(`M${cx(a)} ${a.y} V${bus} H${Math.max(...group.map(cx))}`,'update');path(`M${cx(a)} ${bus} H${Math.min(...group.map(cx))}`,'update');
    for(const n of group)path(`M${cx(n)} ${bus} V${n.y+n.h}`,'update update-end');
    const xr=62,y=l.y+l.h+15;path(`M${r.x} ${cy(r)} H${xr} V${y} H${l.x+35} V${l.y+l.h}`,'rule')
  }
  function renderEdges(){edgeLayer.replaceChildren();mainEdges();auditEdges();signalEdges();updateEdges()}
  function render(){renderEdges();renderNodes()}
  function select(id){selected=id;for(const g of nodeLayer.children)g.classList.toggle('selected',g.dataset.id===id);syncFields()}
  function syncFields(){const n=selected&&data[selected];fields.disabled=!n;document.getElementById('selectionTitle').textContent=n?n.title.replace(/\n/g,' '):'Выберите блок';if(n){titleInput.value=n.title;detailInput.value=n.detail;xInput.value=Math.round(n.x);yInput.value=Math.round(n.y)}}
  function point(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
  function clamp(n){n.x=Math.max(0,Math.min(800-n.w,n.x));n.y=Math.max(62,Math.min(1080-n.h,n.y))}
  function startDrag(e){if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();const g=e.currentTarget,id=g.dataset.id,p=point(e),n=data[id];select(id);drag={id,g,px:p.x,py:p.y,x:n.x,y:n.y};g.setPointerCapture(e.pointerId)}
  svg.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),n=data[drag.id];n.x=drag.x+p.x-drag.px;n.y=drag.y+p.y-drag.py;clamp(n);drag.g.setAttribute('transform',`translate(${n.x} ${n.y})`);renderEdges();syncFields()});
  const endDrag=()=>{if(drag){drag=null;save()}};svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
  for(const [el,key] of [[titleInput,'title'],[detailInput,'detail']])el.addEventListener('input',()=>{if(!selected)return;data[selected][key]=el.value;renderNodes();select(selected);save()});
  for(const [el,key] of [[xInput,'x'],[yInput,'y']])el.addEventListener('change',()=>{if(!selected)return;data[selected][key]=Number(el.value)||0;clamp(data[selected]);render();select(selected);save()});
  function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  function svgBlob(){const copy=svg.cloneNode(true);copy.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'));copy.removeAttribute('id');copy.setAttribute('width','800');copy.setAttribute('height','1132');return new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml;charset=utf-8'})}
  document.getElementById('svgBtn').onclick=()=>download(svgBlob(),'PCAS-custom-layout.svg');
  document.getElementById('pngBtn').onclick=()=>{const u=URL.createObjectURL(svgBlob()),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=2400;c.height=3396;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b&&download(b,'PCAS-custom-layout.png'),'image/png')};img.onerror=()=>{URL.revokeObjectURL(u);setStatus('Не удалось создать PNG; попробуйте SVG')};img.src=u};
  document.getElementById('jsonBtn').onclick=()=>download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'PCAS-layout.json');
  document.getElementById('jsonInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||typeof obj!=='object'||Object.keys(defaults).some(id=>!obj[id]||!Number.isFinite(+obj[id].x)||!Number.isFinite(+obj[id].y)))throw Error('Некорректный файл');data=clone();for(const id of Object.keys(defaults)){data[id]={...data[id],...obj[id]};data[id].x=+data[id].x;data[id].y=+data[id].y;clamp(data[id])}selected=null;render();syncFields();save();setStatus('Расположение загружено')}catch{setStatus('Этот JSON не подходит для схемы PCAS')}e.target.value=''};
  document.getElementById('resetBtn').onclick=()=>{data=clone();selected=null;render();syncFields();save();setStatus('Исходное расположение восстановлено')};
  render();syncFields();
})();
</script>
</body>
</html>
